         <!-- higlights the selected button  -->
        <script>

        function buttonactive(clickedButton){

            let buttons = document.querySelectorAll(".historybutton");

            buttons.forEach(button => {
            button.classList.remove("active");
        });

    clickedButton.classList.add("active");
}

<!-- first graph container -->
        <div class = "historytab1">
            <!-- creates space where the graph will be drawn-->
            <canvas alt = " history graphs 1" id = "historyline1"></canvas>
        </div>
        <!-- creates the graph -->
            <script>
                const linectx12 = document.getElementById('historyline1');

        const myChart = new Chart(linectx12, {
            type: 'line',

            data: {
                labels: [
                    'Monday','Tuesday','Wednesday',
                    'Thursday','Friday','Saturday','Sunday'
                ],
                //data values used by graph
                datasets: [
                    {
                        label: 'Carbon intensity gCO₂/kWh',
                        data: [180,140,130,150,170,120,130],
                        borderColor: 'red',
                        tension: 0.4
                    },

                    {
                        label: 'Solar power gCO₂/kWh',
                        data: [120,140,120,160,180,160,150],
                        borderColor: 'orange',
                        tension: 0.4
                    },

                    {
                        label: 'Hydro power gCO₂/kWh',
                        data: [200,140,130,120,140,150,60],
                        borderColor: 'green',
                        tension: 0.4
                    }
                ]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,

                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
        //changes values in the graph
        function changeWeek() {
            myChart.data.labels = [
                'Monday','Tuesday','Wednesday',
                'Thursday','Friday','Saturday','Sunday'
            ];

            myChart.data.datasets[0].data = [180,140,130,150,170,120,130];
            myChart.data.datasets[1].data = [120,140,120,160,180,160,150];
            myChart.data.datasets[2].data = [200,140,130,120,140,150,60];

            myChart.update();
        }
        //changes values in the graph
        function changeMonth() {
            myChart.data.labels = [
                'Week 1','Week 2','Week 3','Week 4'
            ];

            myChart.data.datasets[0].data = [1190,1170,1010,1810];
            myChart.data.datasets[1].data = [1410,1510,1710,1160];
            myChart.data.datasets[2].data = [1810,1601,1140,1170];

            myChart.update();
        }
        //changes values in the graph
        function changeYear() {
            myChart.data.labels = [
                'Jan','Feb','Mar','Apr',
                'May','Jun','Jul'
            ];

            myChart.data.datasets[0].data = [1320,1400,1690,1480,1410,1295,1370];
            myChart.data.datasets[1].data = [1250,1160,1440,1580,1490,1300,1285];
            myChart.data.datasets[2].data = [1220,1200,1490,1580,1670,1760,1850];

            myChart.update();
        }
            </script>
